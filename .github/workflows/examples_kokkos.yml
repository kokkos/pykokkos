name: examples/kokkos

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test_pykokkos:
    strategy:
      matrix:
        platform: [ubuntu-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade numpy mypy==1.0.1 cmake pytest pybind11 scikit-build patchelf
      - name: Install pykokkos-base
        run: |
          python install_base.py install -- -DENABLE_LAYOUTS=ON -DENABLE_MEMORY_TRAITS=OFF -DENABLE_VIEW_RANKS=2
      - name: Install pykokkos
        run: |
          python -m pip install .
      - name: mypy check
        run: |
          mypy pykokkos
      - name: Run all kokkos examples
        run: |
          for f in examples/kokkos/*.py; do
            if [[ "$f" == *_cuda.py ]]; then
              echo "Ignoring cuda scripts $f"
            elif [[ "$f" == *_lambda.py ]]; then
              echo "Ignoring lambda script $f, see https://github.com/kokkos/pykokkos/issues/346"
            else
              echo "Running $f..."
              python "$f" || exit 1
            fi
          done
