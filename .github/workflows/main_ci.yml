name: Python Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test_pykokkos:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04-arm]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }} and CI tools
        uses: ./.github/actions/setup-tools
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pykokkos-base
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          python install_base.py install -- -DENABLE_LAYOUTS=ON -DENABLE_MEMORY_TRAITS=OFF -DENABLE_VIEW_RANKS=5
      - name: Install pykokkos
        run: |
          python -m pip install .
      - name: mypy check
        run: |
          mypy pykokkos
      - name: run tests
        run: |
          python runtests.py
